# Trigger fresh GitHub Pages deployment after enabling Pages in repository settings.
name: Build Ryu
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install dependencies
        run: npm install
      - name: Typecheck and build web assets
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Configure Android OAuth deep link
        run: node scripts/patch-android-oauth.mjs
      - name: Copy web assets into Android app
        run: npx cap sync android
      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ryu-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload web build for preview
        uses: actions/upload-artifact@v4
        with:
          name: ryu-web-dist
          path: dist/
          if-no-files-found: error

  web-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Serialize Pages deployments so GitHub never receives overlapping deploy requests.
    concurrency:
      group: ryu-pages-deployment
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build web preview
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - name: Deploy Ryu web test build
        id: deployment
        uses: actions/deploy-pages@v4
