name: Build Ryu
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Typecheck and build
        run: npm run build
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: ryu-web-dist
          path: dist/
          if-no-files-found: error